name: Build and Push Docker Images

on:
  # Run daily at midnight UTC. Daily (not weekly) keeps the floating tags
  # fresh: Postgres patch releases, base-image security fixes, and wrapper
  # changes reach :14–:18 (and etcd/haproxy) within a day instead of up to a
  # week. The changes filter plus registry build cache keep no-op runs cheap.
  # Every published per-minor tag (:16.12, :18.3, ...) is rebuilt on the same
  # cadence — see discover-postgres-minors — so a cluster PINNED to an old
  # minor keeps receiving wrapper fixes and CVE-refreshed layers too.
  schedule:
    - cron: '0 0 * * *'
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      force:
        description: "Bypass the content gate and rebuild+push everything"
        type: boolean
        default: false
  # Build on push to main
  push:
    branches:
      - main
      - paulo/rust
    paths:
      - 'postgres-patroni/**'
      - 'etcd/**'
      - 'haproxy/**'
      - 'common/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/build-and-push.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}
  # Which major version gets the "latest" tag
  LATEST_POSTGRES_MAJOR: 18
  # Component versions (update these to release new versions)
  ETCD_VERSION: "3.6.6"
  HAPROXY_VERSION: "3.2"
  ALPINE_VERSION: "3.19"
  # No suffix - publish to regular tags
  BETA_SUFFIX: ''

jobs:
  # Detect which components changed to avoid unnecessary builds
  changes:
    runs-on: ubuntu-latest
    outputs:
      postgres: ${{ steps.filter.outputs.postgres }}
      etcd: ${{ steps.filter.outputs.etcd }}
      haproxy: ${{ steps.filter.outputs.haproxy }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            postgres:
              - 'postgres-patroni/**'
              - 'common/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/build-and-push.yml'
            etcd:
              - 'etcd/**'
              - 'common/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/build-and-push.yml'
            haproxy:
              - 'haproxy/**'
              - 'common/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/build-and-push.yml'

  # Build Rust binaries for postgres-patroni (AMD64 - native, fast ~2-3min)
  build-rust-binaries-postgres-amd64:
    needs: changes
    if: ${{ needs.changes.outputs.postgres == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push rust binaries for amd64
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./postgres-patroni/Dockerfile
          target: rust-builder-local-output
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/postgres-rust-binaries:latest
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}/postgres-rust-binaries:latest
          cache-to: type=inline

  # Build Rust binaries for etcd (AMD64 - alpine, native, fast ~2-3min)
  build-rust-binaries-etcd-amd64:
    needs: changes
    if: ${{ needs.changes.outputs.etcd == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push rust binaries for etcd amd64
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./etcd/Dockerfile
          target: rust-builder-local-output
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/etcd-rust-binaries:latest
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}/etcd-rust-binaries:latest
          cache-to: type=inline

  # Build Rust binaries for haproxy (AMD64 - alpine, native, fast ~2-3min)
  build-rust-binaries-haproxy-amd64:
    needs: changes
    if: ${{ needs.changes.outputs.haproxy == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push rust binaries for haproxy amd64
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./haproxy/Dockerfile
          target: rust-builder-local-output
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/haproxy-rust-binaries:latest
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}/haproxy-rust-binaries:latest
          cache-to: type=inline

  # Which postgres minors to build. Two sources, unioned:
  #   1. every per-minor tag already published on ghcr — the PINNABLE surface.
  #      Upstream never re-mints a superseded patch tag, so a cluster pinned
  #      to :16.12 only receives wrapper fixes and CVE-refreshed layers if WE
  #      keep rebuilding that tag (the same reason redis-ha/mysql-ha build
  #      every minor series continuously);
  #   2. the newest upstream minor of every supported major, so a fresh patch
  #      release enters the set the day it ships.
  # Fails closed: a registry listing error or an unresolvable major aborts
  # the run rather than silently building a shrunken set.
  discover-postgres-minors:
    needs: changes
    if: ${{ needs.changes.outputs.postgres == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
      - name: Discover minors to build
        id: discover
        run: |
          set -euo pipefail

          SUPPORTED_MAJORS="14 15 16 17 18"

          # Newest upstream minor per supported major, via the Docker
          # Registry v2 API (registry-1.docker.io) — the Hub website API
          # hard-blocks shared GitHub runner IPs with persistent 403s.
          HUB_TOKEN=$(curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 \
            "https://auth.docker.io/token?service=registry.docker.io&scope=repository:library/postgres:pull" \
            | jq -r .token)
          [ -n "$HUB_TOKEN" ] && [ "$HUB_TOKEN" != "null" ]
          UPSTREAM_MINORS=$(curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 \
            -H "Authorization: Bearer $HUB_TOKEN" \
            "https://registry-1.docker.io/v2/library/postgres/tags/list?n=10000" \
            | jq -r '.tags[]' | grep -E '^[0-9]+\.[0-9]+$')

          # Every per-minor tag we have ever published (anonymous pull token —
          # the package is public).
          GHCR_TOKEN=$(curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 \
            "https://ghcr.io/token?scope=repository:${{ github.repository }}/postgres-patroni:pull" \
            | jq -r .token)
          [ -n "$GHCR_TOKEN" ] && [ "$GHCR_TOKEN" != "null" ]
          PUBLISHED_MINORS=$(curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 \
            -H "Authorization: Bearer $GHCR_TOKEN" \
            "https://ghcr.io/v2/${{ github.repository }}/postgres-patroni/tags/list?n=10000" \
            | jq -r '.tags[]' | grep -E '^[0-9]+\.[0-9]+$' || true)

          INCLUDE="[]"
          for MAJOR in $SUPPORTED_MAJORS; do
            LATEST=$(printf '%s\n' "$UPSTREAM_MINORS" | grep -E "^${MAJOR}\.[0-9]+$" | sort -V | tail -1)
            if [ -z "$LATEST" ]; then
              echo "::error::no upstream minor resolved for major ${MAJOR} — refusing to shrink the build set"
              exit 1
            fi
            MINORS=$( { printf '%s\n' "$PUBLISHED_MINORS" | grep -E "^${MAJOR}\.[0-9]+$" || true; echo "$LATEST"; } | sort -uV)
            for MINOR in $MINORS; do
              IS_LATEST=$([ "$MINOR" = "$LATEST" ] && echo true || echo false)
              INCLUDE=$(jq -c --arg major "$MAJOR" --arg minor "$MINOR" --argjson latest "$IS_LATEST" \
                '. + [{major: $major, minor: $minor, latest: $latest}]' <<<"$INCLUDE")
            done
          done

          # Published minors outside the supported majors stay frozen on
          # purpose (e.g. a tag from a since-retired major) — say so instead
          # of dropping them silently.
          printf '%s\n' "$PUBLISHED_MINORS" \
            | grep -vE "^($(echo $SUPPORTED_MAJORS | tr ' ' '|'))\." \
            | sed 's/^/::warning::published minor tag outside supported majors, NOT rebuilt: /' || true

          COUNT=$(jq 'length' <<<"$INCLUDE")
          echo "building ${COUNT} minors: $(jq -r '[.[].minor] | join(", ")' <<<"$INCLUDE")"
          echo "matrix=$(jq -c '{include: .}' <<<"$INCLUDE")" >> "$GITHUB_OUTPUT"

  # Build postgres-patroni for AMD64 (depends only on amd64 rust binaries).
  # One job per discovered minor: the minor tag is always pushed; the major
  # tag (and :latest) rides along on whichever minor is that major's newest.
  build-postgres-patroni-amd64:
    needs: [changes, build-rust-binaries-postgres-amd64, discover-postgres-minors]
    if: ${{ needs.changes.outputs.postgres == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      # A single minor failing to build must not cancel the backfill of the
      # rest of the pinnable surface.
      fail-fast: false
      matrix: ${{ fromJson(needs.discover-postgres-minors.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get short SHA
        id: sha
        run: echo "short=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      # Skip the build entirely — same digest, no fleet redeploys — unless
      # something REAL moved: the repo code that reaches the image, the
      # upstream base image, or Debian's pending-security-fix set for that
      # base (frozen patch tags never re-mint upstream, so apt fixes are the
      # only way OS updates reach them). The key is planted on the published
      # image as a label; digest-tracking consumers (autoUpdates tagMode
      # "sha") therefore only ever see a new digest when there is something
      # worth redeploying for. Fails OPEN to building — a gate error must
      # never silently freeze a tag.
      - name: Content gate
        id: gate
        run: |
          set -o pipefail
          IMG="${{ env.IMAGE_PREFIX }}/postgres-patroni"
          TAG="${{ matrix.minor }}${{ env.BETA_SUFFIX }}"

          GATE_OK=true
          CODE_KEY=$(git rev-parse HEAD:postgres-patroni HEAD:common HEAD:Cargo.toml HEAD:Cargo.lock | sha256sum | cut -c1-16) || GATE_OK=false
          BASE_DIGEST=$(docker buildx imagetools inspect "postgres:${{ matrix.minor }}" --format '{{json .Manifest.Digest}}' | tr -d '"') || GATE_OK=false
          docker pull -q "postgres:${{ matrix.minor }}" >/dev/null || GATE_OK=false
          PKG_KEY=$(docker run --rm "postgres:${{ matrix.minor }}" bash -c "apt-get update -qq >/dev/null 2>&1; apt list --upgradable 2>/dev/null | sort" | sha256sum | cut -c1-16) || GATE_OK=false

          if [ "$GATE_OK" != "true" ] || [ -z "$CODE_KEY" ] || [ -z "$BASE_DIGEST" ] || [ -z "$PKG_KEY" ]; then
            echo "::warning::content gate failed for ${TAG}; building unconditionally"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "key=gate-error-${{ github.sha }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          KEY=$(printf '%s\n' "$CODE_KEY" "$BASE_DIGEST" "$PKG_KEY" | sha256sum | cut -c1-32)
          echo "key=$KEY" >> "$GITHUB_OUTPUT"

          PUBLISHED_KEY=$(docker buildx imagetools inspect "$IMG:$TAG" --format '{{json .Image}}' 2>/dev/null \
            | jq -r '.config.Labels["railway.content-key"] // empty' 2>/dev/null || true)

          if [ "${{ github.event.inputs.force || 'false' }}" = "true" ]; then
            echo "force requested — building"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif [ "$KEY" = "$PUBLISHED_KEY" ]; then
            echo "unchanged (key $KEY) — skipping build; digest stays put"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed (key $KEY, published ${PUBLISHED_KEY:-<none>}) — building"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Push only the immutable sha tag here; the resolvable tags (:X.Y and,
      # for the newest minor, :X / :latest) are minted below AFTER the
      # bundled-version guard, so a build that bundles the wrong minor can
      # never reach a tag the platform pins — the same guard redis-ha and
      # mysql-ha already run.
      - name: Build and push Docker image for amd64
        if: steps.gate.outputs.changed == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./postgres-patroni/Dockerfile
          target: ha
          platforms: linux/amd64
          push: true
          build-args: |
            POSTGRES_VERSION=${{ matrix.major }}
            POSTGRES_IMAGE_TAG=${{ matrix.minor }}
            APT_REFRESH=${{ steps.gate.outputs.key }}
          labels: |
            railway.content-key=${{ steps.gate.outputs.key }}
          build-contexts: |
            rust-binaries=docker-image://${{ env.IMAGE_PREFIX }}/postgres-rust-binaries:latest
          tags: |
            ${{ env.IMAGE_PREFIX }}/postgres-patroni:${{ matrix.minor }}-${{ steps.sha.outputs.short }}${{ env.BETA_SUFFIX }}
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}/postgres-patroni:${{ matrix.minor }}
          cache-to: type=inline

      # The tag IS the compatibility contract (a pin to :16.12 trusts that
      # the image bundles Postgres 16.12), so refuse to publish a build
      # whose bundled server is anything else rather than poison the tag —
      # exactly what an unheld apt-get upgrade did once: PGDG always carries
      # the major's newest minor, so the upgrade silently replaced the
      # pinned server packages.
      - name: Verify the bundled minor matches the matrix entry, then publish
        if: steps.gate.outputs.changed == 'true'
        run: |
          IMG="${{ env.IMAGE_PREFIX }}/postgres-patroni"
          img="$IMG:${{ matrix.minor }}-${{ steps.sha.outputs.short }}${{ env.BETA_SUFFIX }}"
          version=$(docker run --rm --entrypoint postgres "$img" --version)
          echo "bundled: $version"
          minor=$(echo "$version" | sed -nE 's/.*\(PostgreSQL\) ([0-9]+\.[0-9]+).*/\1/p')
          if [ -z "$minor" ]; then
            echo "could not parse a major.minor out of postgres --version" >&2
            exit 1
          fi
          if [ "$minor" != "${{ matrix.minor }}" ]; then
            echo "bundled minor $minor does not match matrix entry ${{ matrix.minor }}" >&2
            exit 1
          fi

          tags="-t $IMG:${{ matrix.minor }}${{ env.BETA_SUFFIX }}"
          if [ "${{ matrix.latest }}" = "true" ]; then
            tags="$tags -t $IMG:${{ matrix.major }}${{ env.BETA_SUFFIX }}"
            tags="$tags -t $IMG:${{ matrix.major }}-${{ steps.sha.outputs.short }}${{ env.BETA_SUFFIX }}"
            if [ "${{ matrix.major }}" = "${{ env.LATEST_POSTGRES_MAJOR }}" ]; then
              tags="$tags -t $IMG:latest${{ env.BETA_SUFFIX }}"
            fi
          fi
          docker buildx imagetools create $tags "$img"

      # Unchanged image: keep the per-commit pin tags and the major/latest
      # pointers current WITHOUT minting a new digest — imagetools create
      # only adds tag references to the existing manifest.
      - name: Refresh pin tags on unchanged image
        if: steps.gate.outputs.changed == 'false'
        run: |
          IMG="${{ env.IMAGE_PREFIX }}/postgres-patroni"
          SRC="$IMG:${{ matrix.minor }}${{ env.BETA_SUFFIX }}"
          TAGS=(-t "$IMG:${{ matrix.minor }}-${{ steps.sha.outputs.short }}${{ env.BETA_SUFFIX }}")
          if [ "${{ matrix.latest }}" = "true" ]; then
            TAGS+=(-t "$IMG:${{ matrix.major }}${{ env.BETA_SUFFIX }}")
            TAGS+=(-t "$IMG:${{ matrix.major }}-${{ steps.sha.outputs.short }}${{ env.BETA_SUFFIX }}")
            if [ "${{ matrix.major }}" = "${{ env.LATEST_POSTGRES_MAJOR }}" ]; then
              TAGS+=(-t "$IMG:latest${{ env.BETA_SUFFIX }}")
            fi
          fi
          docker buildx imagetools create "${TAGS[@]}" "$SRC"

  # Build etcd for AMD64 (depends only on amd64 etcd rust binaries)
  build-etcd-amd64:
    needs: [changes, build-rust-binaries-etcd-amd64]
    if: ${{ needs.changes.outputs.etcd == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get short SHA and version parts
        id: meta
        run: |
          echo "sha=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT
          echo "major=$(echo ${{ env.ETCD_VERSION }} | cut -d. -f1)" >> $GITHUB_OUTPUT
          echo "minor=$(echo ${{ env.ETCD_VERSION }} | cut -d. -f1-2)" >> $GITHUB_OUTPUT

      # Same content gate as postgres-patroni (see that job for rationale).
      # No package dimension: the etcd base image is distroless-style (no
      # shell, no package manager) — repo code + base digest cover everything
      # that can change. The fleet's etcd nodes run autoUpdates tagMode "sha",
      # so a spuriously re-minted digest here redeploys every etcd in every
      # cluster for nothing.
      - name: Content gate
        id: gate
        run: |
          set -o pipefail
          IMG="${{ env.IMAGE_PREFIX }}/etcd"
          TAG="${{ env.ETCD_VERSION }}${{ env.BETA_SUFFIX }}"

          GATE_OK=true
          CODE_KEY=$(git rev-parse HEAD:etcd HEAD:common HEAD:Cargo.toml HEAD:Cargo.lock | sha256sum | cut -c1-16) || GATE_OK=false
          BASE_DIGEST=$(docker buildx imagetools inspect "quay.io/coreos/etcd:v${{ env.ETCD_VERSION }}" --format '{{json .Manifest.Digest}}' | tr -d '"') || GATE_OK=false

          if [ "$GATE_OK" != "true" ] || [ -z "$CODE_KEY" ] || [ -z "$BASE_DIGEST" ]; then
            echo "::warning::content gate failed for etcd; building unconditionally"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "key=gate-error-${{ github.sha }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          KEY=$(printf '%s\n' "$CODE_KEY" "$BASE_DIGEST" | sha256sum | cut -c1-32)
          echo "key=$KEY" >> "$GITHUB_OUTPUT"

          PUBLISHED_KEY=$(docker buildx imagetools inspect "$IMG:$TAG" --format '{{json .Image}}' 2>/dev/null \
            | jq -r '.config.Labels["railway.content-key"] // empty' 2>/dev/null || true)

          if [ "${{ github.event.inputs.force || 'false' }}" = "true" ]; then
            echo "force requested — building"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif [ "$KEY" = "$PUBLISHED_KEY" ]; then
            echo "unchanged (key $KEY) — skipping build; digest stays put"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed (key $KEY, published ${PUBLISHED_KEY:-<none>}) — building"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push etcd for amd64
        if: steps.gate.outputs.changed == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./etcd/Dockerfile
          build-args: ETCD_VERSION=${{ env.ETCD_VERSION }}
          labels: |
            railway.content-key=${{ steps.gate.outputs.key }}
          build-contexts: |
            rust-binaries=docker-image://${{ env.IMAGE_PREFIX }}/etcd-rust-binaries:latest
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/etcd:latest${{ env.BETA_SUFFIX }}
            ${{ env.IMAGE_PREFIX }}/etcd:${{ env.ETCD_VERSION }}${{ env.BETA_SUFFIX }}
            ${{ env.IMAGE_PREFIX }}/etcd:${{ steps.meta.outputs.minor }}${{ env.BETA_SUFFIX }}
            ${{ env.IMAGE_PREFIX }}/etcd:${{ steps.meta.outputs.major }}${{ env.BETA_SUFFIX }}
            ${{ env.IMAGE_PREFIX }}/etcd:${{ env.ETCD_VERSION }}-${{ steps.meta.outputs.sha }}${{ env.BETA_SUFFIX }}
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}/etcd:latest
          cache-to: type=inline

      - name: Refresh pin tags on unchanged image
        if: steps.gate.outputs.changed == 'false'
        run: |
          IMG="${{ env.IMAGE_PREFIX }}/etcd"
          SRC="$IMG:${{ env.ETCD_VERSION }}${{ env.BETA_SUFFIX }}"
          docker buildx imagetools create \
            -t "$IMG:${{ env.ETCD_VERSION }}-${{ steps.meta.outputs.sha }}${{ env.BETA_SUFFIX }}" \
            -t "$IMG:${{ steps.meta.outputs.minor }}${{ env.BETA_SUFFIX }}" \
            -t "$IMG:${{ steps.meta.outputs.major }}${{ env.BETA_SUFFIX }}" \
            -t "$IMG:latest${{ env.BETA_SUFFIX }}" \
            "$SRC"

  # Build haproxy for AMD64 (depends only on amd64 haproxy rust binaries)
  build-haproxy-amd64:
    needs: [changes, build-rust-binaries-haproxy-amd64]
    if: ${{ needs.changes.outputs.haproxy == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get short SHA and version parts
        id: meta
        run: |
          echo "sha=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT
          echo "major=$(echo ${{ env.HAPROXY_VERSION }} | cut -d. -f1)" >> $GITHUB_OUTPUT

      # Same content gate as postgres-patroni (see that job for rationale).
      # Package dimension via apk: the alpine base's pending-upgrade set,
      # so a published fix for postgresql-client/bash/openssl re-mints the
      # image while quiet weeks stay digest-stable. The fleet's edge nodes
      # run autoUpdates tagMode "sha" — spurious digests here roll every
      # HAProxy in every cluster.
      - name: Content gate
        id: gate
        run: |
          set -o pipefail
          IMG="${{ env.IMAGE_PREFIX }}/haproxy"
          TAG="${{ env.HAPROXY_VERSION }}${{ env.BETA_SUFFIX }}"
          BASE="haproxy:${{ env.HAPROXY_VERSION }}-alpine"

          GATE_OK=true
          CODE_KEY=$(git rev-parse HEAD:haproxy HEAD:common HEAD:Cargo.toml HEAD:Cargo.lock | sha256sum | cut -c1-16) || GATE_OK=false
          BASE_DIGEST=$(docker buildx imagetools inspect "$BASE" --format '{{json .Manifest.Digest}}' | tr -d '"') || GATE_OK=false
          docker pull -q "$BASE" >/dev/null || GATE_OK=false
          PKG_KEY=$(docker run --user root --rm "$BASE" sh -c "apk update -q >/dev/null 2>&1; apk version -l '<' 2>/dev/null | sort" | sha256sum | cut -c1-16) || GATE_OK=false

          if [ "$GATE_OK" != "true" ] || [ -z "$CODE_KEY" ] || [ -z "$BASE_DIGEST" ] || [ -z "$PKG_KEY" ]; then
            echo "::warning::content gate failed for haproxy; building unconditionally"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "key=gate-error-${{ github.sha }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          KEY=$(printf '%s\n' "$CODE_KEY" "$BASE_DIGEST" "$PKG_KEY" | sha256sum | cut -c1-32)
          echo "key=$KEY" >> "$GITHUB_OUTPUT"

          PUBLISHED_KEY=$(docker buildx imagetools inspect "$IMG:$TAG" --format '{{json .Image}}' 2>/dev/null \
            | jq -r '.config.Labels["railway.content-key"] // empty' 2>/dev/null || true)

          if [ "${{ github.event.inputs.force || 'false' }}" = "true" ]; then
            echo "force requested — building"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif [ "$KEY" = "$PUBLISHED_KEY" ]; then
            echo "unchanged (key $KEY) — skipping build; digest stays put"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed (key $KEY, published ${PUBLISHED_KEY:-<none>}) — building"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push haproxy for amd64
        if: steps.gate.outputs.changed == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./haproxy/Dockerfile
          build-args: |
            HAPROXY_VERSION=${{ env.HAPROXY_VERSION }}
            PKG_REFRESH=${{ steps.gate.outputs.key }}
          labels: |
            railway.content-key=${{ steps.gate.outputs.key }}
          build-contexts: |
            rust-binaries=docker-image://${{ env.IMAGE_PREFIX }}/haproxy-rust-binaries:latest
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/haproxy:latest${{ env.BETA_SUFFIX }}
            ${{ env.IMAGE_PREFIX }}/haproxy:${{ env.HAPROXY_VERSION }}${{ env.BETA_SUFFIX }}
            ${{ env.IMAGE_PREFIX }}/haproxy:${{ steps.meta.outputs.major }}${{ env.BETA_SUFFIX }}
            ${{ env.IMAGE_PREFIX }}/haproxy:${{ env.HAPROXY_VERSION }}-${{ steps.meta.outputs.sha }}${{ env.BETA_SUFFIX }}
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}/haproxy:latest
          cache-to: type=inline

      - name: Refresh pin tags on unchanged image
        if: steps.gate.outputs.changed == 'false'
        run: |
          IMG="${{ env.IMAGE_PREFIX }}/haproxy"
          SRC="$IMG:${{ env.HAPROXY_VERSION }}${{ env.BETA_SUFFIX }}"
          docker buildx imagetools create \
            -t "$IMG:${{ env.HAPROXY_VERSION }}-${{ steps.meta.outputs.sha }}${{ env.BETA_SUFFIX }}" \
            -t "$IMG:${{ steps.meta.outputs.major }}${{ env.BETA_SUFFIX }}" \
            -t "$IMG:latest${{ env.BETA_SUFFIX }}" \
            "$SRC"
